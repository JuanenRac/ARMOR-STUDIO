# ARMOR-STUDIO security headers, included by every location of the container's nginx (see default.conf.template).
# Copyright (C) 2026 JuanenRac (Electro Hobby 3D). GPL-3.0-or-later.
#
# nginx only inherits the add_header lines of the server block into a location that has NONE of its own, so a location that sets Cache-Control used to lose every header below
# (the policy that matters most is the one on the HTML document). Each location includes this file instead.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tilecache.rainviewer.com https://view.eumetsat.int https://server.arcgisonline.com; media-src 'self' blob:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://air-quality-api.open-meteo.com https://api.rainviewer.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
