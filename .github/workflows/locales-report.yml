# It never stops a change: a language that lacks phrases, keeps English text or has labels much longer than English is written as a warning
# (an annotation of the run), judged by the limits in src/i18nReport.config.json. Only a language over "failMissing" fails the run, and that
# limit is set so high that nothing fails yet. Turn it off with the repository variable ARMOR_LOCALES_REPORT set to "off".
name: Language tables report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Language tables
    if: ${{ vars.ARMOR_LOCALES_REPORT != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Report the language tables
        run: node tools/i18n_report.mjs --limits --github
