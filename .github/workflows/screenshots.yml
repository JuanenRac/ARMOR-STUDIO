# Started by hand only (workflow_dispatch): it never runs on a push or on a pull request. It builds Studio and ARMOR-SERVER, starts the server in a throw-away folder with made-up
# data (a site drawn by the script, nodes played by ARMOR-SIMULATOR, ARMOR-VISION on a made-up camera), takes every screen of docs/screenshots.json with the Chromium of Playwright
# (tools/capture_screenshots.py) and keeps the pictures as the artifact "screenshots" for two weeks. It has no secrets, publishes nothing and changes nothing in the repository:
# download the artifact, look at the pictures and copy the ones you want into images/screenshots.
#
#   gh workflow run screenshots.yml --repo JuanenRac/ARMOR-STUDIO --ref main

name: Screenshots (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Take the screenshots of the README
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the script looks for these four next to Studio (ARMOR_SERVER_DIR, ARMOR_SIMULATOR_DIR, ARMOR_VISION_DIR and ARMOR_SERVER_AI_DIR name another place)
      - name: Fetch the repositories it runs with
        run: |
          for name in ARMOR-SERVER ARMOR-SIMULATOR ARMOR-VISION ARMOR-SERVER-AI; do
            git clone --depth 1 "https://github.com/JuanenRac/${name}.git" "../${name}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build Studio
        run: |
          npm ci
          npm run build

      - name: Build the server
        working-directory: ../ARMOR-SERVER
        run: |
          npm ci
          npm run build

      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Take the screenshots
        env:
          ARMOR_SHOTS_CHANNEL: chromium
        run: |
          python -m pip install --quiet pillow
          python tools/capture_screenshots.py --out "$RUNNER_TEMP/screenshots"

      - name: List the pictures
        run: |
          {
            echo "### Screenshots"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            for picture in "$RUNNER_TEMP"/screenshots/*.png; do
              echo "| $(basename "$picture") | $(stat -c %s "$picture") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
          if-no-files-found: error
