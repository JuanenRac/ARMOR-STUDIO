# It is a workflow of its own, apart from the baseline one, so that it can be turned off without touching the rest:
#   * set the repository variable ARMOR_STUDIO_E2E to "off" (Settings > Secrets and variables > Actions > Variables) and every run is skipped, or
#   * disable the workflow in the Actions tab (gh workflow disable e2e.yml).
# e2e/ci_stack.py does the work: it starts the server of the sibling checkout, renders the nginx template of the image around the built page and runs the Playwright tests of e2e/tests.
name: Studio e2e (nginx, server and browser)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: nginx of the image + ARMOR-SERVER + Playwright
    if: ${{ vars.ARMOR_STUDIO_E2E != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch the server it runs against
        run: git clone --depth 1 https://github.com/JuanenRac/ARMOR-SERVER.git ../ARMOR-SERVER

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Studio
        run: |
          npm ci
          npm run build

      - name: Build the server
        working-directory: ../ARMOR-SERVER
        run: |
          npm ci
          npm run build

      - name: Install nginx (the script runs its own copy, the service is not used)
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          sudo systemctl stop nginx || true

      - name: Install the browser and the test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: python e2e/ci_stack.py
        env:
          NGINX_BIN: /usr/sbin/nginx
          NGINX_MIME_TYPES: /etc/nginx/mime.types
          ARMOR_E2E_CHANNEL: chromium

      - name: Keep the traces of a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
